<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Главная страница</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(120deg, #ff9a9e, #fad0c4, #a18cd1);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    text-align: center;
    background: white;
    padding: 50px;
    border-radius: 20px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.2);
}

h1 {
    color: #6a5acd;
    margin-bottom: 10px;
}

p {
    color: #555;
}

button {
    margin-top: 20px;
    padding: 12px 25px;
    border: none;
    border-radius: 30px;
    background: #6a5acd;
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #483d8b;
    transform: scale(1.05);
}
</style>
</head>

<body>

<div class="container">
    <h1>Мой первый сайт</h1>
    <p>Добро пожаловать на мою главную страницу</p>
    <button onclick="alert('Спасибо за визит!')">Нажми меня</button>
</div>

</body>
</html>
